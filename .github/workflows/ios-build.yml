name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip

          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Download Godot export templates
        run: |
          curl -L -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"

          unzip -q templates.tpz -d templates

          cp -R templates/templates/* \
            "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Check Godot
        run: |
          ./Godot.app/Contents/MacOS/Godot --version

      - name: Export iOS Xcode project
        run: |
          rm -rf ios-build
          mkdir -p ios-build

          ./Godot.app/Contents/MacOS/Godot \
            --headless \
            --path . \
            --export-debug "IOS YAHHH" \
            ios-build/

      - name: Find Xcode project
        run: |
          XCODE_PROJECT="$(find ios-build -name '*.xcodeproj' -print -quit)"

          if [ -z "$XCODE_PROJECT" ]; then
            echo "ERROR: No Xcode project was generated."
            find ios-build -maxdepth 4 -print
            exit 1
          fi

          echo "XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$XCODE_PROJECT"

      - name: Find Xcode scheme
        run: |
          xcodebuild -list -json \
            -project "$XCODE_PROJECT" \
            > xcode-list.json

          SCHEME="$(python3 -c '
          import json
          with open("xcode-list.json") as f:
              data = json.load(f)
          print(data["project"]["schemes"][0])
          ')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            xcodebuild -list -project "$XCODE_PROJECT"
            exit 1
          fi

          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Using scheme:"
          echo "$SCHEME"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Find compiled app
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build/Build/Products" \
            -maxdepth 2 \
            -type d \
            -name '*.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            find "$GITHUB_WORKSPACE/build/Build/Products" -maxdepth 4 -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Compiled app:"
          echo "$APP_PATH"

      - name: Package IPA
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP_PATH" ipa/Payload/

          cd ipa

          zip -qry \
            "$GITHUB_WORKSPACE/ProjectQuestnt-unsigned.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          echo "IPA created:"
          ls -lh ProjectQuestnt-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-unsigned-IPA
          path: ProjectQuestnt-unsigned.ipa

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-Xcode-project
          path: ios-build/
