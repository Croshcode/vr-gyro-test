name: Build iOS

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          set -euxo pipefail

          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip

          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Download Godot export templates
        run: |
          set -euxo pipefail

          curl -L --fail --retry 3 \
            -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"

          rm -rf templates
          mkdir templates

          unzip -q templates.tpz -d templates

          cp -R templates/templates/* \
            "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Check Godot
        run: |
          set -euxo pipefail

          echo "===== GODOT VERSION ====="
          ./Godot.app/Contents/MacOS/Godot --version

          echo "===== RUNNER ====="
          sw_vers
          uname -a

          echo "===== DISK SPACE ====="
          df -h .

      - name: Export iOS Xcode project
        timeout-minutes: 20
        run: |
          set -u

          echo "========================================"
          echo "STARTING GODOT IOS EXPORT"
          echo "========================================"

          rm -rf ios-build
          mkdir -p ios-build

          EXPORT_LOG="$GITHUB_WORKSPACE/godot-ios-export.log"

          ./Godot.app/Contents/MacOS/Godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "IOS YAHHH" \
            ios-build/ \
            2>&1 | tee "$EXPORT_LOG"

          GODOT_EXIT=${PIPESTATUS[0]}

          echo "========================================"
          echo "GODOT EXPORT FINISHED"
          echo "========================================"

          echo "Exit code: $GODOT_EXIT"

          echo ""
          echo "===== GENERATED FILES ====="
          find ios-build -maxdepth 4 -print | sort || true

          echo ""
          echo "===== LAST 200 GODOT LOG LINES ====="
          tail -200 "$EXPORT_LOG" || true

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "ERROR: Godot export failed."
            exit "$GODOT_EXIT"
          fi

      - name: Upload Godot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS-export-diagnostics
          path: |
            godot-ios-export.log
            ios-build/
          if-no-files-found: ignore

      - name: Rename Xcode project
        run: |
          set -euxo pipefail

          if [ -d "ios-build/.xcodeproj" ]; then
            mv \
              "ios-build/.xcodeproj" \
              "ios-build/ProjectQuestnt.xcodeproj"
          else
            echo "ERROR: Generated Xcode project was not found."
            exit 1
          fi

          ls -la ios-build/

      - name: Set Xcode project
        run: |
          set -euxo pipefail

          XCODE_PROJECT="ios-build/ProjectQuestnt.xcodeproj"

          if [ ! -d "$XCODE_PROJECT" ]; then
            echo "ERROR: ProjectQuestnt.xcodeproj was not found."
            exit 1
          fi

          echo "XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"

      - name: Validate Xcode project
        run: |
          set -euxo pipefail

          echo "===== XCODE PROJECT ====="
          echo "$XCODE_PROJECT"

          echo ""
          echo "===== XCODE PROJECT LIST ====="

          xcodebuild \
            -list \
            -project "$XCODE_PROJECT"

      - name: Find Xcode scheme
        run: |
          set -euxo pipefail

          echo "===== FINDING XCODE SCHEME ====="

          SCHEME="$(
            xcodebuild \
              -list \
              -project "$XCODE_PROJECT" 2>/dev/null |
            awk '
              /Schemes:/ {
                found = 1
                next
              }

              found && NF {
                gsub(/^[[:space:]]+/, "", $0)
                gsub(/[[:space:]]+$/, "", $0)
                print $0
                exit
              }
            '
          )"

          echo "Detected scheme: [$SCHEME]"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            exit 1
          fi

          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "XCODE_SCHEME saved as:"
          echo "[$SCHEME]"

      - name: Build unsigned iOS app
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILDING IOS APP"
          echo "========================================"

          echo "Project: [$XCODE_PROJECT]"
          echo "Scheme:  [$XCODE_SCHEME]"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PRODUCT_NAME="ProjectQuestnt" \
            build 2>&1 | tee xcode-build.log

      - name: Find compiled app
        run: |
          set -euxo pipefail

          APP_PATH="$(
            find "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 2 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."

            echo ""
            echo "===== BUILD PRODUCTS ====="

            find \
              "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 4 \
              -print \
              || true

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Compiled app:"
          echo "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP_PATH" ipa/Payload/

          cd ipa

          zip -qry \
            "$GITHUB_WORKSPACE/ProjectQuestnt-unsigned.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          echo "IPA created:"
          ls -lh ProjectQuestnt-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-unsigned-IPA
          path: ProjectQuestnt-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: xcode-build.log
          if-no-files-found: ignore

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-Xcode-project
          path: ios-build/
