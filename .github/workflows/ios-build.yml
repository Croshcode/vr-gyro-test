name: Build iOS

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          set -euxo pipefail

          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip

          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Download Godot export templates
        run: |
          set -euxo pipefail

          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"

          rm -rf templates
          mkdir templates

          unzip -q templates.tpz -d templates

          cp -R templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Check Godot
        run: |
          set -euxo pipefail

          echo "===== GODOT VERSION ====="
          ./Godot.app/Contents/MacOS/Godot --version

          echo "===== RUNNER ====="
          sw_vers
          uname -a

          echo "===== DISK SPACE ====="
          df -h .

      - name: Export iOS Xcode project
        timeout-minutes: 20
        run: |
          set -u

          echo "========================================"
          echo "STARTING GODOT IOS EXPORT"
          echo "========================================"

          date

          rm -rf ios-build
          mkdir -p ios-build

          EXPORT_LOG="$GITHUB_WORKSPACE/godot-ios-export.log"

          echo "Export log: $EXPORT_LOG"
          echo "Starting Godot..."

          ./Godot.app/Contents/MacOS/Godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "IOS YAHHH" \
            ios-build/ \
            2>&1 | tee "$EXPORT_LOG"

          GODOT_EXIT=${PIPESTATUS[0]}

          echo "========================================"
          echo "GODOT EXPORT FINISHED"
          echo "========================================"

          echo "Exit code: $GODOT_EXIT"
          date

          echo "===== IOS-BUILD SIZE ====="
          du -sh ios-build || true

          echo "===== GENERATED FILES ====="
          find ios-build -maxdepth 4 -print | sort || true

          echo "===== LAST 200 LOG LINES ====="
          tail -200 "$EXPORT_LOG" || true

          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "ERROR: Godot export failed."
            exit "$GODOT_EXIT"
          fi

          echo "Godot export completed successfully."

      - name: Upload Godot export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS-export-diagnostics
          path: |
            godot-ios-export.log
            ios-build/
          if-no-files-found: ignore

      - name: Repair generated Xcode project
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path("ios-build/.xcodeproj/project.pbxproj")
          scheme = Path("ios-build/.xcodeproj/xcshareddata/xcschemes/.xcscheme")

          if not project.exists():
              raise SystemExit("ERROR: project.pbxproj was not generated.")

          if not scheme.exists():
              raise SystemExit("ERROR: Xcode scheme was not generated.")

          target_id = "D0BCFE3318AEBDA2004A7AAE"
          product_id = "D0BCFE3418AEBDA2004A7AAE"

          project_text = project.read_text()

          project_text = project_text.replace(
              'D0BCFE3418AEBDA2004A7AAE /* .app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = ".app";',
              'D0BCFE3418AEBDA2004A7AAE /* ProjectQuestnt.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = "ProjectQuestnt.app";'
          )

          project_text = project_text.replace(
              'D0BCFE3318AEBDA2004A7AAE /*  */ = {',
              'D0BCFE3318AEBDA2004A7AAE /* ProjectQuestnt */ = {'
          )

          project_text = project_text.replace(
              'Build configuration list for PBXNativeTarget ""',
              'Build configuration list for PBXNativeTarget "ProjectQuestnt"'
          )

          target_pattern = (
              r'(D0BCFE3318AEBDA2004A7AAE /\* ProjectQuestnt \*/ = \{.*?'
              r'\n\s*name = )""(;'
          )

          project_text, count = re.subn(
              target_pattern,
              r'\1"ProjectQuestnt"\2',
              project_text,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  f"ERROR: Could not repair native target name. Matches: {count}"
              )

          project_text = project_text.replace(
              'D0BCFE3418AEBDA2004A7AAE /* .app */',
              'D0BCFE3418AEBDA2004A7AAE /* ProjectQuestnt.app */'
          )

          scheme_text = scheme.read_text()

          scheme_text = scheme_text.replace(
              'BlueprintIdentifier = "A340BDFEBCA49239A941883D"',
              f'BlueprintIdentifier = "{target_id}"'
          )

          scheme_text = scheme_text.replace(
              'BlueprintName = ""',
              'BlueprintName = "ProjectQuestnt"'
          )

          scheme_text = scheme_text.replace(
              'BuildableName = ".app"',
              'BuildableName = "ProjectQuestnt.app"'
          )

          scheme_text = scheme_text.replace(
              'ReferencedContainer = "container:.xcodeproj"',
              'ReferencedContainer = "container:ProjectQuestnt.xcodeproj"'
          )

          scheme.write_text(scheme_text)
          project.write_text(project_text)

          print("Xcode project repair complete.")
          print(f"Target ID: {target_id}")
          print(f"Product ID: {product_id}")
          print("Target name: ProjectQuestnt")
          print("Product: ProjectQuestnt.app")
          print("Scheme: ProjectQuestnt")
          PY

      - name: Rename Xcode project
        run: |
          set -euxo pipefail

          if [ -d "ios-build/.xcodeproj" ]; then
            mv "ios-build/.xcodeproj" "ios-build/ProjectQuestnt.xcodeproj"
          else
            echo "ERROR: Generated Xcode project was not found."
            exit 1
          fi

          ls -la ios-build/

      - name: Set Xcode project
        run: |
          set -euxo pipefail

          XCODE_PROJECT="ios-build/ProjectQuestnt.xcodeproj"

          if [ ! -d "$XCODE_PROJECT" ]; then
            echo "ERROR: ProjectQuestnt.xcodeproj was not found."
            exit 1
          fi

          echo "XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"

      - name: Validate Xcode project
        run: |
          set -euxo pipefail

          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Find Xcode scheme
        run: |
          set -euxo pipefail

          SCHEME="$(
            xcodebuild -list -project "$XCODE_PROJECT" 2>/dev/null |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                print
                exit
              }
            '
          )"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            exit 1
          fi

          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Using scheme: $SCHEME"

      - name: Build unsigned iOS app
        run: |
          set -euxo pipefail

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Find compiled app
        run: |
          set -euxo pipefail

          APP_PATH="$(
            find "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 2 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            find "$GITHUB_WORKSPACE/build/Build/Products" -maxdepth 4 -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Compiled app: $APP_PATH"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP_PATH" ipa/Payload/

          cd ipa

          zip -qry "$GITHUB_WORKSPACE/ProjectQuestnt-unsigned.ipa" Payload

          cd "$GITHUB_WORKSPACE"

          ls -lh ProjectQuestnt-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-unsigned-IPA
          path: ProjectQuestnt-unsigned.ipa

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-Xcode-project
          path: ios-build/
