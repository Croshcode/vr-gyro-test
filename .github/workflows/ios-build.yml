name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip

          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Download Godot export templates
        run: |
          curl -L -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"

          unzip -q templates.tpz -d templates

          cp -R templates/templates/* \
            "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Check Godot
        run: |
          ./Godot.app/Contents/MacOS/Godot --version

      - name: Export iOS Xcode project
        run: |
          rm -rf ios-build
          mkdir -p ios-build

          ./Godot.app/Contents/MacOS/Godot \
            --headless \
            --path . \
            --export-debug "IOS YAHHH" \
            ios-build/

      - name: Repair generated Xcode project
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path("ios-build/.xcodeproj/project.pbxproj")
          scheme = Path("ios-build/.xcodeproj/xcshareddata/xcschemes/.xcscheme")

          if not project.exists():
              raise SystemExit("ERROR: project.pbxproj was not generated.")

          if not scheme.exists():
              raise SystemExit("ERROR: Xcode scheme was not generated.")

          target_id = "D0BCFE3318AEBDA2004A7AAE"
          product_id = "D0BCFE3418AEBDA2004A7AAE"

          project_text = project.read_text()

          # ------------------------------------------------------------
          # Repair the generated application product reference.
          # ------------------------------------------------------------

          project_text = project_text.replace(
              'D0BCFE3418AEBDA2004A7AAE /* .app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = ".app";',
              'D0BCFE3418AEBDA2004A7AAE /* ProjectQuestnt.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = "ProjectQuestnt.app";'
          )

          # ------------------------------------------------------------
          # Repair the native target name.
          # ------------------------------------------------------------

          project_text = project_text.replace(
              'D0BCFE3318AEBDA2004A7AAE /*  */ = {',
              'D0BCFE3318AEBDA2004A7AAE /* ProjectQuestnt */ = {'
          )

          project_text = project_text.replace(
              'Build configuration list for PBXNativeTarget ""',
              'Build configuration list for PBXNativeTarget "ProjectQuestnt"'
          )

          # Only repair the native target's empty name field.
          target_pattern = (
              r'(D0BCFE3318AEBDA2004A7AAE /\* ProjectQuestnt \*/ = \{.*?'
              r'\n\s*name = )""(;'
          )

          project_text, count = re.subn(
              target_pattern,
              r'\1"ProjectQuestnt"\2',
              project_text,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  f"ERROR: Could not repair the native target name. Matches: {count}"
              )

          # ------------------------------------------------------------
          # Repair the product reference comments wherever they occur.
          # ------------------------------------------------------------

          project_text = project_text.replace(
              'D0BCFE3418AEBDA2004A7AAE /* .app */',
              'D0BCFE3418AEBDA2004A7AAE /* ProjectQuestnt.app */'
          )

          # ------------------------------------------------------------
          # Repair the scheme.
          # ------------------------------------------------------------

          scheme_text = scheme.read_text()

          # Godot generated the wrong BlueprintIdentifier.
          scheme_text = scheme_text.replace(
              'BlueprintIdentifier = "A340BDFEBCA49239A941883D"',
              f'BlueprintIdentifier = "{target_id}"'
          )

          # Godot generated an empty BlueprintName.
          scheme_text = scheme_text.replace(
              'BlueprintName = ""',
              'BlueprintName = "ProjectQuestnt"'
          )

          # Godot generated ".app" instead of the actual product name.
          scheme_text = scheme_text.replace(
              'BuildableName = ".app"',
              'BuildableName = "ProjectQuestnt.app"'
          )

          # The project itself was renamed below, so make the scheme point
          # to the repaired project name.
          scheme_text = scheme_text.replace(
              'ReferencedContainer = "container:.xcodeproj"',
              'ReferencedContainer = "container:ProjectQuestnt.xcodeproj"'
          )

          scheme.write_text(scheme_text)
          project.write_text(project_text)

          print("Xcode project repair complete.")
          print(f"Target ID:  {target_id}")
          print(f"Product ID: {product_id}")
          print("Target name: ProjectQuestnt")
          print("Product: ProjectQuestnt.app")
          print("Scheme: ProjectQuestnt")
          PY

          echo ""
          echo "===== REPAIRED PROJECT CHECKS ====="

          grep -n \
            -E 'PBXNativeTarget|name = "ProjectQuestnt"|productName = "Project Questnt"|ProjectQuestnt.app' \
            ios-build/.xcodeproj/project.pbxproj \
            | head -80

          echo ""
          echo "===== REPAIRED SCHEME ====="

          cat ios-build/.xcodeproj/xcshareddata/xcschemes/.xcscheme

      - name: Rename Xcode project
        run: |
          if [ -d "ios-build/.xcodeproj" ]; then
            mv "ios-build/.xcodeproj" "ios-build/ProjectQuestnt.xcodeproj"
          else
            echo "ERROR: Generated .xcodeproj was not found."
            exit 1
          fi

          echo "Xcode project:"
          ls -la ios-build/

      - name: Find Xcode project
        run: |
          XCODE_PROJECT="ios-build/ProjectQuestnt.xcodeproj"

          if [ ! -d "$XCODE_PROJECT" ]; then
            echo "ERROR: ProjectQuestnt.xcodeproj was not found."
            exit 1
          fi

          echo "XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"

          echo "Using Xcode project:"
          echo "$XCODE_PROJECT"

      - name: Validate Xcode project
        run: |
          echo "===== XCODE PROJECT ====="
          echo "$XCODE_PROJECT"

          echo ""
          echo "===== XCODE PROJECT LIST ====="

          xcodebuild \
            -list \
            -project "$XCODE_PROJECT"

      - name: Find Xcode scheme
        run: |
          echo "Finding Xcode scheme..."

          SCHEME="$(
            xcodebuild \
              -list \
              -project "$XCODE_PROJECT" 2>/dev/null |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                print
                exit
              }
            '
          )"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found."
            exit 1
          fi

          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo ""
          echo "Using scheme:"
          echo "$SCHEME"

      - name: Build unsigned iOS app
        run: |
          echo "Building:"
          echo "Project: $XCODE_PROJECT"
          echo "Scheme:  $XCODE_SCHEME"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Find compiled app
        run: |
          APP_PATH="$(
            find "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 2 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."

            echo ""
            echo "Build products:"
            find "$GITHUB_WORKSPACE/build/Build/Products" \
              -maxdepth 4 \
              -print

            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "Compiled app:"
          echo "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP_PATH" ipa/Payload/

          cd ipa

          zip -qry \
            "$GITHUB_WORKSPACE/ProjectQuestnt-unsigned.ipa" \
            Payload

          cd "$GITHUB_WORKSPACE"

          echo ""
          echo "IPA created:"
          ls -lh ProjectQuestnt-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-unsigned-IPA
          path: ProjectQuestnt-unsigned.ipa

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ProjectQuestnt-Xcode-project
          path: ios-build/
